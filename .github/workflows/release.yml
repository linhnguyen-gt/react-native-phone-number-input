name: Automated Release

on:
    push:
        branches:
            - master
        paths-ignore:
            - "**.md"
            - ".github/**"
            - "!.github/workflows/release.yml"

jobs:
    release:
        runs-on: ubuntu-latest
        # Prevent running on release commits to avoid infinite loops
        if: '!contains(github.event.head_commit.message, ''chore: release'')'

        permissions:
            contents: write
            issues: write
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  registry-url: "https://registry.npmjs.org"
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Configure NPM Authentication
              if: '!cancelled() && env.NPM_TOKEN != '''''
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
                  echo "registry=https://registry.npmjs.org/" >> .npmrc

            - name: Check for releasable commits
              id: check
              run: |
                  # Get the latest tag
                  LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                  if [ -z "$LATEST_TAG" ]; then
                    echo "No previous tags found, proceeding with release"
                    echo "should_release=true" >> $GITHUB_OUTPUT
                  else
                    echo "Latest tag: $LATEST_TAG"

                    # Check if there are any conventional commits since the last tag
                    COMMITS=$(git log $LATEST_TAG..HEAD --pretty=format:"%s")

                    if echo "$COMMITS" | grep -qE "^(feat|fix|perf|refactor|revert|docs|style|chore|test|build|ci)(\(.+\))?!?:"; then
                      echo "Found releasable commits"
                      echo "should_release=true" >> $GITHUB_OUTPUT
                    else
                      echo "No releasable commits found"
                      echo "should_release=false" >> $GITHUB_OUTPUT
                    fi
                  fi

            - name: Run release-it
              if: steps.check.outputs.should_release == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  # Run release-it in CI mode
                  # It will:
                  # 1. Determine version bump from conventional commits
                  # 2. Update package.json version
                  # 3. Generate CHANGELOG.md
                  # 4. Create git commit for release
                  # 5. Create git tag
                  # 6. Push tag to GitHub
                  # 7. Create GitHub release with changelog
                  # 8. Publish to npm (if NPM_TOKEN is set)

                  if [ -n "$NPM_TOKEN" ]; then
                    echo "NPM_TOKEN is set, will publish to npm"
                    npm run release -- --ci
                  else
                    echo "NPM_TOKEN is not set, skipping npm publish"
                    npm run release -- --ci --no-npm
                  fi

            - name: Extract Latest Changelog
              if: steps.check.outputs.should_release == 'true'
              id: changelog
              run: |
                  # Extract only the latest version section from CHANGELOG.md
                  VERSION=$(git describe --tags --abbrev=0)

                  # Use awk to extract content between first # [version] and second # [version]
                  CHANGELOG=$(awk '/^# \[[0-9]/{if(++count==2) exit; if(count==1) next} count==1' CHANGELOG.md)

                  # Save to file for GitHub release update
                  echo "$CHANGELOG" > /tmp/release-notes.md

                  echo "Extracted changelog for $VERSION"

            - name: Update GitHub Release Notes
              if: steps.check.outputs.should_release == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(git describe --tags --abbrev=0)

                  # Update the release with extracted changelog
                  gh release edit $VERSION --notes-file /tmp/release-notes.md
