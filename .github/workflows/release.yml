name: Automated Release

# Releases are cut deliberately, never by merging code. The dispatch input picks
# the increment; "auto" lets release-it derive it from conventional commits so a
# breaking change can no longer ship as a patch.
on:
    workflow_dispatch:
        inputs:
            increment:
                description: "Version increment passed to release-it (auto = derive from conventional commits)"
                required: false
                default: "auto"
                type: choice
                options:
                    - auto
                    - patch
                    - minor
                    - major

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            issues: write
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  registry-url: "https://registry.npmjs.org"
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
            - name: Run release-it
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INCREMENT: ${{ inputs.increment }}
              run: |
                  # release-it bumps the version, writes the changelog, tags, and creates
                  # the GitHub release. It does NOT publish to npm — npm.publish is false;
                  # the Publish step below is this repo's single path to the registry.
                  # increment=auto omits the explicit bump so conventional commits decide it.
                  if [ "$INCREMENT" = "auto" ]; then
                      INCREMENT_ARGS=""
                  else
                      INCREMENT_ARGS="$INCREMENT"
                  fi
                  npm run release -- $INCREMENT_ARGS --ci

            - name: Extract Latest Changelog
              id: changelog
              run: |
                  VERSION=$(git describe --tags --abbrev=0)
                  VERSION_NUMBER=${VERSION#v}

                  # Extract only the released version's section from CHANGELOG.md,
                  # matching both "# [x.y.z]" and "## [x.y.z]" heading styles.
                  awk -v ver="$VERSION_NUMBER" '
                      $0 ~ "^#+ \\[" ver "\\]" { found = 1; next }
                      found && /^#+ \[[0-9]/ { exit }
                      found { print }
                  ' CHANGELOG.md > /tmp/release-notes.md

                  if [ ! -s /tmp/release-notes.md ]; then
                      echo "::error::No changelog section found for $VERSION_NUMBER"
                      exit 1
                  fi

                  echo "Extracted changelog for $VERSION"

            - name: Update GitHub Release Notes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(git describe --tags --abbrev=0)

                  # Update the release with extracted changelog
                  gh release edit $VERSION --notes-file /tmp/release-notes.md

            - name: Publish to NPM
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish --access public
