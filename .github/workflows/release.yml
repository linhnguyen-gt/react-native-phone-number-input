name: Automated Release

# Releases are cut deliberately, never by merging code. A push trigger computed the
# version from commit messages, which meant a breaking change could ship as a patch.
on:
    workflow_dispatch:
        inputs:
            increment:
                description: "Version increment passed to release-it"
                required: true
                default: "patch"
                type: choice
                options:
                    - patch
                    - minor
                    - major

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            issues: write
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  registry-url: "https://registry.npmjs.org"
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Run release-it
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # release-it bumps the version, writes the changelog, tags, and creates the
                  # GitHub release. It does NOT publish to npm — npm.publish is false and
                  # publish.yml is the single path to the registry, gated on that GitHub release.
                  npm run release -- ${{ inputs.increment }} --ci

            - name: Extract Latest Changelog
              id: changelog
              run: |
                  # Extract only the latest version section from CHANGELOG.md
                  VERSION=$(git describe --tags --abbrev=0)

                  # Use awk to extract content between first # [version] and second # [version]
                  CHANGELOG=$(awk '/^# \[[0-9]/{if(++count==2) exit; if(count==1) next} count==1' CHANGELOG.md)

                  # Save to file for GitHub release update
                  echo "$CHANGELOG" > /tmp/release-notes.md

                  echo "Extracted changelog for $VERSION"

            - name: Update GitHub Release Notes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(git describe --tags --abbrev=0)

                  # Update the release with extracted changelog
                  gh release edit $VERSION --notes-file /tmp/release-notes.md
